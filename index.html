<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mewoof - Wellness Pet Blog</title>
  
  <!-- Enlazamos con el archivo style.css -->
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- CONTENEDOR PRINCIPAL -->
  <div class="contenedor-principal">

    <!-- 1. BARRA DE NAVEGACIÓN SUPERIOR -->
    <div class="barra-navegacion">
      
      <!-- Menú centrado -->
      <div class="menu-enlaces">
        <a href="#">INICIO</a>
        <span class="separador">|</span>
        <a href="#">NOSOTROS</a>
        <span class="separador">|</span>
        <a href="#">CONTACTENOS</a>
      </div>

      <!-- Logo pequeño superior derecho -->
      <div class="logo-superior">
        <img src="./Image20261001135351.png" alt="Logo Mewoof Pequeño">
      </div>

    </div>

    <!-- 2. SECCIÓN PRINCIPAL / BANNER -->
    <div class="seccion-banner">

      <!-- Contenedor del texto/logo flotante (arriba a la izquierda) -->
      <div class="bloque-marca">
        <div class="icono-hueso">
          <img src="./Image20261001135351.png" alt="Hueso amarillo">
        </div>
        <h1 class="titulo-mewoof">mewoof</h1>
        <p class="subtitulo-mewoof">Wellness Pet Blog</p>
      </div>

      <!-- Contenedor de la imagen que cubre toda la sección -->
      <div class="bloque-mascotas">
        <img src="./2.png" alt="Perros y gatos">
      </div>

    </div>

  </div>
