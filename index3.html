
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos | Meowof</title>
    <link rel="stylesheet" href="style3.css">
</head>
<body>

    
    <header class="encabezado">
        <nav class="navegacion">
            <div class="menu">
                <a href="index.html">INICIO</a>
                <span>|</span>
                <a href="index2.html">NOSOTROS</a>
                <span>|</span>
                <a href="index3.html">CONTÁCTANOS</a>
            </div>

            <div class="logo">
                <span class="logo-icono"></span>Mewoof
                <small>Wellness Pet Blog</small>
            </div>
        </nav>
    </header>

    
    <main class="contacto">

        
        <div class="huella">
            
        </div>

       
        <h1>Contáctanos</h1>

        <div class="contenido">

            <!-- IMAGEN DECORATIVA -->
            <div class="gato-decorativo">
                <img src="./imagen/10(1).png" alt="Gato">
            </div>

            <!-- INFORMACIÓN DE CONTACTO -->
            <section class="informacion">
                <div class="dato">
                    <h2>Correo electrónico</h2>
                    <p>uncorreo@meowof.com</p>
                </div>

                <div class="dato">
                    <h2>Teléfonos</h2>
                    <p>+57 300 555 5555</p>
                </div>

                <div class="ubicacion">
                    <span class="pin"></span>
                    <p>Bogotá, Colombia</p>
                </div>
            </section>

            <!-- FORMULARIO -->
            <section class="formulario">
                <form action="#" method="post">

                    <div class="campo">
                        <label for="nombre">nombre:</label>
                        <input
                            type="text"
                            id="nombre"
                            name="nombre"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="correo">correo:</label>
                        <input
                            type="email"
                            id="correo"
                            name="correo"
                            required
                        >
                    </div>

                    <div class="campo">
                        <label for="mensaje">Mensaje:</label>
                        <textarea
                            id="mensaje"
                            name="mensaje"
                            rows="4"
                            required
                        ></textarea>
                    </div>

                    <button type="submit">enviar</button>

                </form>
            </section>

        </div>
    </main>

   
    <footer class="pie-pagina">
        <div class="footer-logo">meowof</div>

        <span class="separador">●</span>

        <p>Darwin - Daniel - Laura - Diego - Naya</p>

        <span class="separador">●</span>

        <p>uncorreo@meowof.com</p>

        <span class="separador">●</span>

        <p>+57 300 555 5555</p>
    </footer>

</body>
</html>
