<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contáctanos | Meowof</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="style3.css">
</head>

<body>

    <div class="container-fluid">

        <div class="row">

            <!--IZQUIERDA -->
            <aside class="col-12 col-lg-1 publicidad izquierda">
                <div class="publicidad-box">
                    <h5>Izquierda</h5>
                    <p>izquierdo</p>
                </div>
            </aside>


            <!-- CONTENEDOR CENTRAL-->
            <main class="col-12 col-lg-10 contenido">

                <div class="contenedor-imagen">

                    <img src="./imagen/woofit.png" class="img-fluid" alt="Fondo">

                    <h1 class="text-center mb-">
                        Contáctanos
                    </h1>

                    <div class="contenido">


                        <div class="gato-decorativo text-center mb-4">
                            <img src="./imagen/10(1).png" alt="Gato" class="img-fluid gato">
                        </div>

                        <section class="informacion row g-3 mb-4">


                            <div class="col-12 col-md-4">

                                <div class="dato h-100 p-3 text-center">

                                    <h2 class="h5">
                                        Correo electrónico
                                    </h2>

                                    <p>
                                        uncorreo@meowof.com
                                    </p>

                                </div>

                            </div>

                            <div class="col-12 col-md-4">

                                <div class="dato h-100 p-3 text-center">

                                    <h2 class="h5">
                                        Teléfonos
                                    </h2>

                                    <p>
                                        +57 300 555 5555
                                    </p>

                                </div>

                            </div>

                            <div class="col-12 col-md-4">

                                <div class="ubicacion h-100 p-3 text-center">

                                    <h2 class="h5">
                                        Ubicación
                                    </h2>

                                    <p>
                                        Bogotá, Colombia
                                    </p>

                                </div>

                            </div>

                        </section>

                        <section class="formulario">

                            <form action="#" method="post">


                                <div class="mb-3">

                                    <label for="nombre" class="form-label">
                                        Nombre:
                                    </label>

                                    <input type="text" id="nombre" name="nombre" class="form-control" required>

                                </div>

                                <div class="mb-3">

                                    <label for="correo" class="form-label">
                                        Correo:
                                    </label>

                                    <input type="email" id="correo" name="correo" class="form-control" required>

                                </div>

                                <div class="mb-3">

                                    <label for="mensaje" class="form-label">
                                        Mensaje:
                                    </label>

                                    <textarea id="mensaje" name="mensaje" rows="4" class="form-control"
                                        required></textarea>

                                </div>

                                <div class="text-center">

                                    <button type="submit" class="btn btn-primary">
                                        Enviar
                                    </button>

                                </div>

                            </form>

                        </section>

                    </div>


            </main>
        </div>


        <!-- DERECHA -->
        <aside class="col-12 col-lg-1 publicidad derecha">
            <div class="publicidad-box">
                <h5>Publicidad</h5>
                <p>derecho</p>
            </div>
        </aside>

    </div>

    </div>

</body>

</html>
